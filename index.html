<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluetooth Receipt Printer</title>
<style>
body { font-family: Arial; padding:40px; }
button { padding:12px 20px; margin:10px; font-size:16px; }
</style>
</head>
<body>

<h2>Bluetooth Receipt Printer</h2>

<button onclick="connectPrinter()">Connect Printer</button>
<button onclick="printReceipt()">Print Receipt</button>

<script>
let printerDevice;
let printerCharacteristic;

function encodeText(text) {
    return new TextEncoder().encode(text);
}

async function connectPrinter() {
    try {
        printerDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'POS58C3' }], // Your printer name
           
        });

        await connectGatt(printerDevice);

        // Save printer ID for reconnection
        localStorage.setItem('printerId', printerDevice.id);
        alert("Printer Connected!");
    } catch (error) {
        console.log(error);
        alert("Connection Failed");
    }
}

async function connectGatt(device) {
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
    printerCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

    // Listen for disconnection
    device.addEventListener('gattserverdisconnected', async () => {
        console.log('Printer disconnected, reconnecting...');
        try {
            await connectGatt(device);
            console.log('Reconnected!');
        } catch (err) {
            console.log('Reconnection failed:', err);
        }
    });
}

async function printReceipt() {
    if (!printerCharacteristic) {
        alert("Connect printer first");
        return;
    }

    let receipt = "";
    receipt += "\x1B\x40";           // initialize
    receipt += "\x1B\x61\x01";       // center
    receipt += "MY STORE\n";
    receipt += "--------------------------\n";
    receipt += "\x1B\x61\x00";       // left
    receipt += "Burger        5.00\n";
    receipt += "Fries         3.00\n";
    receipt += "--------------------------\n";
    receipt += "\x1B\x61\x02";       // right
    receipt += "TOTAL: 8.00\n\n";
    receipt += "\x1B\x61\x01";
    receipt += "Thank You!\n\n\n";
    receipt += "\x1D\x56\x41\x10";   // cut paper

    try {
        await printerCharacteristic.writeValue(encodeText(receipt));
        alert("Printed!");
    } catch (e) {
        console.log(e);
        alert("Print Failed");
    }
}

// Auto-reconnect on page load
window.addEventListener('load', async () => {
    const savedId = localStorage.getItem('printerId');
    if (savedId) {
        try {
            const devices = await navigator.bluetooth.getDevices();
            const device = devices.find(d => d.id === savedId);
            if (device) {
                printerDevice = device;
                await connectGatt(device);
                console.log('Auto-reconnected to printer!');
            }
        } catch (err) {
            console.log('Printer not found or not paired:', err);
        }
    }
});
</script>
</body>
</html>
