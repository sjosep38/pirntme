<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluetooth Receipt Printer</title>

<style>
body{
    font-family: Arial;
    padding:40px;
}
button{
    padding:12px 20px;
    margin:10px;
    font-size:16px;
}
</style>

</head>
<body>

<h2>Bluetooth Receipt Printer</h2>

<button onclick="connectPrinter()">Connect Printer</button>
<button onclick="printReceipt()">Print Receipt</button>

<script>
let cart = [
    { name: "Apple", qty: 2, price: 50 },
    { name: "Banana", qty: 3, price: 20 }
];

let discountEnabled = false;
const DISCOUNT_RATE = 0.1;
let method = "Cash";
let paid = 300;
let orderExtraInfo = "Order #12345";

let printerDevice;
let printerCharacteristic;

function encodeText(text){
    return new TextEncoder().encode(text);
}

async function connectPrinter(){
    try{
        printerDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices:true,
            optionalServices:['000018f0-0000-1000-8000-00805f9b34fb']
        });
        const server = await printerDevice.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        printerCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
        alert("Printer Connected");
    }catch(error){
        console.log(error);
        alert("Connection Failed: " + error);
    }
}

async function printReceipt(){
    if(!printerCharacteristic){
        alert("Connect printer first");
        return;
    }

    let subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
    let discount = discountEnabled ? subtotal * DISCOUNT_RATE : 0;
    let vat = (subtotal - discount) * 0.12;
    let finalTotal = subtotal - discount + vat;
    let change = paid - finalTotal;

    let receipt = "------ RECEIPT ------\n";
    cart.forEach(i=>{ receipt+=`${i.name} x${i.qty} ₱${(i.price*i.qty).toFixed(2)}\n`; });
    receipt+=`Subtotal: ₱${subtotal.toFixed(2)}\n`;
    if(discountEnabled) receipt+=`Discount: ₱${discount.toFixed(2)}\n`;
    receipt+=`VAT: ₱${vat.toFixed(2)}\n`;
    receipt+=`TOTAL: ₱${finalTotal.toFixed(2)}\n`;
    receipt+=`Payment Method: ${method}\n`;
    receipt+=`Paid: ₱${paid.toFixed(2)}\n`;
    receipt+=`Change: ₱${change.toFixed(2)}\n`;
    receipt+=`Order Info: ${orderExtraInfo}\n`;
    receipt+="--------------------\n";

    alert(receipt); // simulate print

    const data = encodeText(receipt + "\x1D\x56\x41\x10");
    try{
        await printerCharacteristic.writeValue(data);
        alert("Printed!");
    }catch(e){
        console.log(e);
        alert("Print Failed: " + e);
    }
}
    const device = await navigator.bluetooth.requestDevice({
  filters: [
    { name: 'POS58C3' }  // Match your printer's Bluetooth name
  ],
  optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']  // Your printer service UUID
});

const server = await device.gatt.connect();
const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
const printerCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

console.log('Printer connected!');
</script>
</body>
</html>
