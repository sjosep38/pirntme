<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluetooth Receipt Printer</title>

<style>
body{
    font-family: Arial;
    padding:40px;
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:16px;
}
</style>
</head>

<body>

<h2>Bluetooth Receipt Printer</h2>

<button onclick="connectPrinter()">Connect Printer</button>
<button onclick="printReceipt()">Print Receipt</button>

<script>

let printerDevice;
let printerCharacteristic;

const SERVICE_UUID = "000018f0-0000-1000-8000-00805f9b34fb";
const CHARACTERISTIC_UUID = "00002af1-0000-1000-8000-00805f9b34fb";

const receiptWidth = 32;

const DISCOUNT_RATE = 0.20;
let discountEnabled = false;

let selectedOrderType = "Dine-In";
let orderExtraInfo = "";

/* SAMPLE CART */
let cart = [
 {name:"Burger",qty:2,price:55},
 {name:"Fries",qty:1,price:35},
 {name:"Coke",qty:2,price:25}
];

function encodeText(text){
    return new TextEncoder().encode(text);
}

async function connectPrinter(){

    try{

        printerDevice = await navigator.bluetooth.requestDevice({
            filters:[{namePrefix:"POS"}],
            optionalServices:[SERVICE_UUID]
        });

        await connectGatt(printerDevice);

        localStorage.setItem("printerId",printerDevice.id);

        alert("Printer Connected");

    }catch(e){

        console.log(e);
        alert("Connection Failed");

    }

}

async function connectGatt(device){

    const server = await device.gatt.connect();

    const service = await server.getPrimaryService(SERVICE_UUID);

    printerCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

    device.addEventListener("gattserverdisconnected", async ()=>{

        console.log("Printer disconnected. Reconnecting...");

        try{
            await connectGatt(device);
            console.log("Reconnected");
        }catch(err){
            console.log("Reconnect failed",err);
        }

    });

}

/* SEND IN CHUNKS (VERY IMPORTANT FOR POS PRINTERS) */

async function sendToPrinter(text){

    const data = encodeText(text);

    const chunkSize = 58;

    for(let i=0;i<data.length;i+=chunkSize){

        await printerCharacteristic.writeValue(
            data.slice(i,i+chunkSize)
        );

        await new Promise(r=>setTimeout(r,20));

    }

}

/* RECEIPT FORMATTING */

function centerText(text){

    let spaces = Math.floor((receiptWidth - text.length)/2);

    if(spaces < 0) spaces = 0;

    return " ".repeat(spaces) + text + "\r\n";

}

function receiptLine(label,value){

    let labelText = label + ":";

    let amountText = " " + Number(value).toFixed(2);

    let spaces = receiptWidth - labelText.length - amountText.length;

    if(spaces < 0) spaces = 0;

    return labelText + " ".repeat(spaces) + amountText + "\r\n";

}

function textLine(label,value){

    value = value || "";

    let spaces = receiptWidth - label.length - value.length;

    if(spaces < 0) spaces = 0;

    return label + " ".repeat(spaces) + value + "\r\n";

}

/* MAIN PRINT FUNCTION */

async function printReceipt(paymentType="Cash",cashReceived=200,change=30){

    if(!printerCharacteristic){

        alert("Connect printer first");
        return;

    }

    if(cart.length===0) return;

    let orderNo = "ORD-"+Date.now().toString().slice(-6);

    let now = new Date();

    let dateTime = now.toLocaleString();

    let receiptText="";

    receiptText += "MASTER KURT FOODHUB";
    receiptText += "2530 Isagani St.";
    receiptText += "Sta Cruz Manila";
    receiptText += "0950-682-5698";

    receiptText += "--------------------------------\r\n";

    receiptText += dateTime+"\r\n";
    receiptText += "Order: "+orderNo+"\r\n";

    let info=(orderExtraInfo||"").slice(0,15);

    receiptText += textLine("",`${selectedOrderType} | ${paymentType} | ${info}`);

    receiptText += "--------------------------------\r\n";

    /* ITEMS */

    cart.forEach(i=>{

        let name=i.name.slice(0,18);

        let nameQty=`${name} x${i.qty}`;

        let price=` ${(i.price*i.qty).toFixed(2)}`;

        let spaces=" ".repeat(Math.max(0,receiptWidth-nameQty.length-price.length));

        receiptText += `${nameQty}${spaces}${price}\r\n`;

    });

    receiptText += "--------------------------------\r\n";

    /* TOTALS */

    let subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);

    let discountAmount = discountEnabled ? subtotal*DISCOUNT_RATE : 0;

    let vatAmount = (subtotal-discountAmount)*0.12;

    let finalTotal = subtotal-discountAmount;

    receiptText += receiptLine("SubTotal",subtotal);
    receiptText += receiptLine("Discount",discountAmount);
    receiptText += receiptLine("VAT 12%",vatAmount);
    receiptText += receiptLine("Total",finalTotal);

    receiptText += receiptLine("Cash",cashReceived);
    receiptText += receiptLine("Change",change);

    receiptText += "--------------------------------\r\n";

    receiptText += centerText("Thank you for your Purchase!");

    receiptText += "\r\n\r\n\r\n";

    try{

        await sendToPrinter(receiptText);

        alert("Receipt Printed");

    }catch(e){

        console.log(e);
        alert("Print Failed");

    }

}

/* AUTO RECONNECT */

window.addEventListener("load", async ()=>{

    const savedId = localStorage.getItem("printerId");

    if(!savedId) return;

    try{

        const devices = await navigator.bluetooth.getDevices();

        const device = devices.find(d=>d.id===savedId);

        if(device){

            printerDevice=device;

            await connectGatt(device);

            console.log("Auto Reconnected");

        }

    }catch(err){

        console.log("Auto reconnect failed",err);

    }

});

</script>

</body>
</html>
